name: Evals

on:
  workflow_dispatch:
    inputs:
      judge:
        description: "Run the LLM judge as well"
        type: boolean
        default: true

jobs:
  eval:
    # Manual-only (workflow_dispatch) — these are real Gemini calls with real
    # cost, so the suite runs only when triggered by hand from the Actions tab.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run eval suite
        run: |
          JUDGE_FLAG=""
          if [ "${{ inputs.judge }}" = "true" ]; then
            JUDGE_FLAG="--judge"
          fi
          python -m evals.runner --threshold 0.9 --output eval-report/report $JUDGE_FLAG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_TOKEN: eval-placeholder-token
          # config.Settings requires a non-empty DATABASE_URL at import time.
          # The eval pipeline never connects to a DB (see evals/runner.py) — this
          # placeholder only satisfies pydantic validation.
          DATABASE_URL: postgresql://eval:eval@localhost/eval

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report/
